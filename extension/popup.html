<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>iCollege Organizer Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      width: 300px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #4f46e5;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #10b981;
      text-align: center;
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e5e5e5;
      }
      h2 {
        border-bottom-color: #333;
      }
      label {
        color: #aaa;
      }
      input {
        background-color: #2d2d2d;
        color: #e5e5e5;
        border-color: #444;
      }
      button {
        background: #4f46e5;
      }
    }
  </style>
</head>
<body>
  <h2>⚙️ Settings</h2>
  
  <div class="form-group" style="background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
    <p style="margin: 0 0 8px 0; font-size: 13px;">1. Send a message to <strong>@icollege1_bot</strong> on Telegram</p>
    <p style="margin: 0; font-size: 13px;">2. Enter your Chat ID below:</p>
  </div>
  
  <div class="form-group">
    <label>Telegram Chat ID</label>
    <input type="text" id="tgChatId" placeholder="123456789" />
  </div>

  <div class="form-group">
    <label>Gemini API Key (For Summaries)</label>
    <input type="password" id="geminiKey" placeholder="AIzaSy..." />
  </div>

  <button id="saveBtn">Save Settings</button>
  <button id="clearDbBtn" style="background: #ef4444; margin-top: 8px;">Clear Scanner Database</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
